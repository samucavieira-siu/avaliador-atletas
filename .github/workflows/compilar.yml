name: Testar Compilacao C++

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Baixar codigo fonte
      uses: actions/checkout@v3

    - name: Compilar codigo C++
      run: g++ -Wall -std=c++17 main.cpp -o avaliador
